# Один бюджет и один val для всех шести кандидатов. Это короткий учебный поиск.
model:
  name: Qwen/Qwen3-0.6B
  revision: main   # run сохраняет разрешённый commit HF, а не только main
  device: auto
  # float32 для всех кандидатов одинаково: bf16 на этом CPU без аппаратной
  # поддержки выполняется медленнее в разы; сравнение конфигураций остаётся честным.
  dtype: float32
  enable_thinking: false
data:
  train: data/tokenized/train.pt
  val: data/tokenized/val.pt
train:
  seed: 42
  max_steps: 4
  train_limit: 32
  val_limit: 8
  batch_size: 1
  grad_accum: 2
  eval_every: 2
  gradient_checkpointing: true
lora:
  dropout: 0.05
  alpha_over_r: 2
sweep:
  - {name: qv-r4-low, r: 4, lr: 0.0001, target_modules: [q_proj, v_proj]}
  - {name: qv-r4-high, r: 4, lr: 0.0003, target_modules: [q_proj, v_proj]}
  - {name: qv-r8-low, r: 8, lr: 0.0001, target_modules: [q_proj, v_proj]}
  - {name: qv-r8-high, r: 8, lr: 0.0003, target_modules: [q_proj, v_proj]}
  - {name: all-r8-low, r: 8, lr: 0.0001, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
  - {name: all-r8-high, r: 8, lr: 0.0003, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
tracking:
  uri: http://127.0.0.1:5006
  experiment: hw6-lora
registry:
  name: my-qwen-adapter
  alias: champion
  # Порог относительный к базе на ТОМ ЖЕ val; меньше loss — лучше.
  max_val_ratio: 1.0
generation:
  max_new_tokens: 16
  # ASCII-промпты: manifest и samples попадают в новый процесс (python -I),
  # где PYTHONUTF8 отключён и кириллица в stdout ломает проверку загрузки.
  system: "You are a statistics assistant. Choose the single correct option. Reply only with JSON containing the single field answer and a letter label from choices."
  prompts:
    - "Which measure of central tendency is most robust to outliers? A - mean, B - median, C - mode, D - range. choices: A, B, C, D."
    - "Which method reduces overfitting by averaging trees grown on bootstrap samples? A - k-means, B - PCA, C - random forest, D - z-test. choices: A, B, C, D."
